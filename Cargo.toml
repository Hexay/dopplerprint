[workspace]
resolver = "3"
members = ["crates/dp-core", "crates/dp-cli", "crates/dp-py", "crates/dp-serve"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/Hexay/dopplerprint"
homepage = "https://github.com/Hexay/dopplerprint"

[workspace.dependencies]
dp-core = { path = "crates/dp-core" }
dp-serve = { path = "crates/dp-serve" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rayon = "1.12"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Iteration profile for eval/py/ingest/profiling (tools/dev.sh): release speed and outputs, incremental, no LTO.
# 256 CGUs: an edit re-optimises only small units (16 → 22 s, 256 → 7 s; docs/research/iteration_loop_2026-11-03.md).
[profile.fastrel]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

[profile.dev]
lto = "off"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.dp-core]
opt-level = 3
