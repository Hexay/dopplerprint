[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "dopplerprint"
version = "0.1.0"
description = "Locate an audio recording from aircraft Doppler curves matched to historical ADS-B"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
prep = ["rasterio>=1.4", "pyproj>=3.7", "requests>=2.32"]
dev = ["pytest>=8", "matplotlib>=3.9"]

[tool.maturin]
manifest-path = "crates/dp-py/Cargo.toml"
module-name = "dopplerprint._core"
python-source = "python"
features = ["pyo3/extension-module"]
