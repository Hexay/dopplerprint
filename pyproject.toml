[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "dopplerprint"
dynamic = ["version"]
description = "Locate an audio recording from aircraft Doppler curves matched to historical ADS-B"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Henry Alexander" }]
keywords = ["doppler", "ads-b", "acoustics", "geolocation", "spectrogram"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["numpy>=2"]

[project.urls]
Homepage = "https://github.com/Hexay/dopplerprint"
Repository = "https://github.com/Hexay/dopplerprint"
Issues = "https://github.com/Hexay/dopplerprint/issues"

[project.optional-dependencies]
prep = ["rasterio>=1.4", "pyproj>=3.7", "requests>=2.32"]
dev = ["pytest>=8", "matplotlib>=3.9"]

[tool.maturin]
manifest-path = "crates/dp-py/Cargo.toml"
module-name = "dopplerprint._core"
python-source = "python"
features = ["pyo3/extension-module"]
# dp-core embeds these with include_bytes!/include_str!; they sit outside the crate dirs.
include = [{ path = "assets/**/*", format = "sdist" }]
