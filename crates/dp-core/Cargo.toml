[package]
name = "dp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["net", "cuda"]
# Downloads (ADS-B days, type DB, terrain tiles) and place-name geocoding.
net = ["dep:ureq"]
# GPU f0 sweep, used at run time only if an NVIDIA driver and device are present (search::backend).
# Loads libcuda dynamically: no CUDA toolkit needed to build.
cuda = ["dep:cudarc"]

[dependencies]
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"], optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
tiff = { version = "0.10", default-features = false, features = ["deflate", "lzw"] }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rayon.workspace = true
hound = "3.5"
memmap2 = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
arrow-array = "60"
arrow-schema = "60"
arrow-select = "60"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
tar = "0.4"
flate2 = "1"
rstar = "0.14"
rustc-hash = "2"
realfft = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "ogg", "vorbis", "adpcm"] }

[dev-dependencies]
tempfile = "3"
