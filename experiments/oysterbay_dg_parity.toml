# Like-for-like with DOPPLERGEIST data/source/reproduce-local.json: ~100 km² region
# (their 0.12°×0.09° box; centre ~450 m from truth), 200 m → 25 m grid, manual event windows.
[eval]
cases = ["oysterbay"]
region_radius_m = 5600.0
region_offset_m = 450.0
time_prior_s = 21600.0
oracle_events = true

[search]
coarse_step_m = 200
min_step_m = 25
keep_top = 200
