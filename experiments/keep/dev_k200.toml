# Refinement keep, tuning baseline: Livermore dev split (28), discovered events with the oracle run alongside
# (summary in oracle/). Hypothesis: none; every experiments/keep/dev_* variant is paired against this.
# See docs/research/refine_keep_mode_centre_2026-11-03.md.
[eval]
cases = ["livermore"]
split = "dev"
data_dir = "/srv/agents/work/doppler_print/data"
store_dir = "/srv/agents/work/doppler_print/data/adsb/store"
time_prior_s = 2.0
oracle_d_range = [150.0, 8000.0]
oracle_v_range = [20.0, 250.0]
oracle_events = false

[search]
keep_top = 200

[search.score]
clock_sweep_s = 2.0
