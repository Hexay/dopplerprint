# Hypothesis: the Δ window alone (3 nats, no basin quota) is enough. Needs the pipeline.rs keep hook.
# Paired against dev_k200.toml.
[eval]
cases = ["livermore"]
split = "dev"
data_dir = "/srv/agents/work/doppler_print/data"
store_dir = "/srv/agents/work/doppler_print/data/adsb/store"
time_prior_s = 2.0
oracle_d_range = [150.0, 8000.0]
oracle_v_range = [20.0, 250.0]
oracle_events = false

[search]
keep_top = 200

[search.keep]
delta_nats = 3.0
cap = 3000

[search.score]
clock_sweep_s = 2.0
