# Hypothesis: refining the top 800 cells per level instead of 200 stops truths falling off the list on flat
# ridges and mirror pairs. Paired against dev_k200.toml. See docs/research/refine_keep_mode_centre_2026-11-03.md.
[eval]
cases = ["livermore"]
split = "dev"
data_dir = "/srv/agents/work/doppler_print/data"
store_dir = "/srv/agents/work/doppler_print/data/adsb/store"
time_prior_s = 2.0
oracle_d_range = [150.0, 8000.0]
oracle_v_range = [20.0, 250.0]
oracle_events = false

[search]
keep_top = 800

[search.score]
clock_sweep_s = 2.0
