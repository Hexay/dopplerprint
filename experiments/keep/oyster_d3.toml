# oysterbay_dg_parity.toml with the keep rule of all40_disc_d3.toml (sanity check). Needs the pipeline.rs hook.
[eval]
cases = ["oysterbay"]
data_dir = "/srv/agents/work/doppler_print/data"
store_dir = "/srv/agents/work/doppler_print/data/adsb/store"
region_radius_m = 5600.0
region_offset_m = 450.0
time_prior_s = 5.0
oracle_events = true

[search]
coarse_step_m = 200
min_step_m = 25
keep_top = 200

[search.keep]
delta_nats = 3.0
cap = 3000
