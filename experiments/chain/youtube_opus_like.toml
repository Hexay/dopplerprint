# Recording-chain preset: long outdoor recording re-published on YouTube, as Oyster Bay
# (corpus_signatures.md §2, §3, §5, §8). Dual-mono "stereo", 9.5 kHz upstream band limit, hum
# strongest at 360 Hz then 240/120 Hz with coherent ENF wander, local 101.25/136.62/987.75 Hz lines,
# a half-order engine line, peaks at −25 dBFS. Round-trip the rendered WAVs through
# tools/sim_codec.sh (opus135 / aac128>opus135) for the codec stage itself.

[device]
peak_dbfs = -25.0
gain_db = 0.0

[chain.hum]
mains_hz = 60.0
harmonics = [0.1, 0.55, 0.1, 0.6, 0.1, 1.0]
tnr_db = 4.0

[[chain.lines]]
hz = 101.25
tnr_db = 6.0

[[chain.lines]]
hz = 136.62
tnr_db = 6.0

[[chain.lines]]
hz = 987.75
tnr_db = 4.0

[chain.source]
am_depth = 0.1
am_rate_hz = 0.7
drift_pct_per_min_sd = 0.2
half_harmonic = 0.5

[chain.path]
ground_coherence = 0.3

[chain.device]
lowpass_hz = 9500.0
quantise_bits = 16
channels = "dual_mono"
