# Recording-chain preset: handheld phone, plain PCM, as in the Livermore May 9/16/17 sessions
# (corpus_signatures.md §3, §6, §8). Merged over a scenario by tools/gen_sim_chain.py.
# Low gain (median peak −30 dBFS, 16-bit), no high-pass, weak 120/240 Hz hum with ENF wander,
# 58.25 Hz motor-slip line (+3×) and the unexplained 25 Hz line, gusty wind on ~15 % of frames,
# engine AM and rpm drift/steps, partially coherent ground reflection.

[device]
peak_dbfs = -30.0
gain_db = 0.0

[chain.hum]
mains_hz = 60.0
harmonics = [0.05, 1.0, 0.1, 0.8, 0.05, 0.3]
tnr_db = 0.0

[[chain.lines]]
hz = 58.25
tnr_db = 2.0
harmonics = [1.0, 0.0, 0.5]

[[chain.lines]]
hz = 25.0
tnr_db = 3.0

[chain.wind]
fraction = 0.15
level_db = 35.0
corner_hz = 40.0
gust_s = 2.0

[chain.source]
am_depth = 0.15
am_rate_hz = 1.0
drift_pct_per_min_sd = 0.3
step_prob = 0.2
step_pct_sd = 1.0
step_ramp_s = 3.0

[chain.path]
ground_coherence = 0.5
turbulence_hz = 0.5

[chain.device]
quantise_bits = 16
