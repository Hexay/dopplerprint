# dev_base.toml + unexplained events at λ_u = −6 z (a 6 z credit per unexplained event; abstain when no
# cell beats N·6). Sweep siblings: dev_lu{4,8,12}.toml.
[eval]
cases = ["livermore"]
split = "dev"
data_dir = "/srv/agents/work/doppler_print/data"
store_dir = "/srv/agents/work/doppler_print/data/adsb/store"
time_prior_s = 2.0
oracle_d_range = [150.0, 8000.0]
oracle_v_range = [20.0, 250.0]
oracle_events = false

[search.assoc]
unexplained_cost = -6.0

[search]
calibration = "auto"

[search.score]
clock_sweep_s = 2.0
