# snr_llr.toml with the likelihood silence term (nats under power_llr; knobs as snr_zsum_lsil.toml).
# Run with --sim-dir experiments/sim_snr; pairs with snr_llr.toml and snr_llr_nosil.toml.
[eval]
cases = ["snr_g"]
time_prior_s = 2.0

[search.assoc]
silence_range_m = 6000.0

[search.assoc.silence]
mode = "likelihood"
r50_m = 5000.0

[search.score]
clock_sweep_s = 2.0
mode = "power_llr"
