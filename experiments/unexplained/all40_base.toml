# livermore_all40_discovered.toml with the calibration table pinned explicitly (the A/B baseline for
# all40_*.toml). Reporting only; never tune on it.
[eval]
cases = ["livermore"]
split = "all"
data_dir = "/srv/agents/work/doppler_print/data"
store_dir = "/srv/agents/work/doppler_print/data/adsb/store"
time_prior_s = 2.0
oracle_d_range = [150.0, 8000.0]
oracle_v_range = [20.0, 250.0]
oracle_events = false

[search]
calibration = "auto"

[search.score]
clock_sweep_s = 2.0
