# livermore_all40_discovered.toml + the likelihood silence term at r50 = 2 km (counted to the default 3 km),
# the knobs sim_snr prefers. Reporting only; never tune on it.
[eval]
cases = ["livermore"]
split = "all"
data_dir = "/srv/agents/work/doppler_print/data"
store_dir = "/srv/agents/work/doppler_print/data/adsb/store"
time_prior_s = 2.0
oracle_d_range = [150.0, 8000.0]
oracle_v_range = [20.0, 250.0]
oracle_events = false

[search.assoc.silence]
mode = "likelihood"
r50_m = 2000.0

[search]
calibration = "auto"

[search.score]
clock_sweep_s = 2.0
